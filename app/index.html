<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="/clubpulse-abb/app/">
  <meta charset="UTF-8">
  <meta content="IE=edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ClubPulse — application du club Athletic Bordj El Bahri (ABB).">
  <meta name="theme-color" content="#1A1A2E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ClubPulse ABB">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>ClubPulse ABB</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="../assets/splash.css">
</head>
<body>
  <div id="splash" class="splash" data-wait="flutter" aria-hidden="true">
    <div class="splash-scene on" data-scene="club">
      <div class="ring"></div>
      <img class="crest" src="../assets/logo-abb-emblem.png" alt="ABB">
      <p class="splash-name">Athletic Bordj El Bahri</p>
    </div>
    <div class="splash-scene" data-scene="ad">
      <p class="kicker">Sponsor officiel</p>
      <img class="ad-logo" src="../assets/sponsor-at-mark.png" alt="Algérie Télécom">
      <p class="ad-name">Algérie Télécom</p>
    </div>
  </div>
  <script src="../assets/splash.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
