<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Replaced by `flutter build web --base-href /app/` -->
  <base href="/clubpulse-abb/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ClubPulse — application du club Athletic Bordj El Bahri (ABB).">
  <meta name="theme-color" content="#1A1A2E">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ClubPulse ABB">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ClubPulse ABB</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0F1624; }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #boot img { width: 96px; height: 96px; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .55; transform: scale(.96); } 50% { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <div id="boot"><img src="icons/Icon-192.png" alt="ABB"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot'); if (b) b.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
