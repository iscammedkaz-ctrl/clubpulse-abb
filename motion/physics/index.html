<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ClubPulse · Physique</title>
<link rel="icon" href="../../assets/favicon.png"/>
<style>
  body { margin:0; background:#070B14; color:#F4F1EA; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; padding:16px 16px 40px; }
  h1 { font-size:20px; margin:0 0 6px; }
  p { color:#9AA3B5; font-size:13px; margin:0 0 16px; }
  a { color:#D4AF37; }
  .stage { height: 160px; background:#0A101C; border-radius:18px; position:relative; overflow:hidden; margin-bottom:14px; }
  .ball { position:absolute; left:50%; top:50%; width:56px; height:56px; margin:-28px 0 0 -28px; object-fit:contain; }
  label { display:block; font-size:12px; color:#9AA3B5; margin:10px 0 4px; }
  input { width:100%; }
  button { width:100%; margin-top:14px; border:0; background:#D4AF37; color:#1A1406; font-weight:800; border-radius:12px; padding:12px; }
  .eq { font-family:ui-monospace,Menlo,monospace; font-size:11px; color:#C9B27A; background:#121A2C; padding:10px; border-radius:12px; margin-top:14px; }
</style>
</head>
<body>
<h1>Physique des animations</h1>
<p>Ressort : masse, raideur, amortissement. Touchez Lancer. <a href="../">Bézier</a> · <a href="../../premium/">App</a></p>
<div class="stage"><img class="ball" id="ball" src="../../assets/logo-abb-emblem.png" alt="ABB"/></div>
<label>Masse <span id="mv">1.0</span></label>
<input id="mass" type="range" min="0.4" max="3" step="0.1" value="1"/>
<label>Raideur <span id="kv">180</span></label>
<input id="stiff" type="range" min="40" max="420" step="5" value="180"/>
<label>Amortissement <span id="dv">16</span></label>
<input id="damp" type="range" min="4" max="40" step="1" value="16"/>
<button type="button" id="go">Lancer depuis la droite</button>
<p class="eq">F = −k·(x − cible) − c·v &nbsp;·&nbsp; a = F / m</p>
<script src="../../assets/physics.js"></script>
<script>
  function sync() {
    mv.textContent = mass.value;
    kv.textContent = stiff.value;
    dv.textContent = damp.value;
  }
  ["mass","stiff","damp"].forEach((id) => document.getElementById(id).oninput = sync);
  go.onclick = function () {
    K3CHPhysics.spring(ball, { x: 120, s: 0.7 }, { x: 0, s: 1 }, {
      mass: +mass.value, stiff: +stiff.value, damp: +damp.value
    });
  };
  go.click();
</script>
</body>
</html>
